services:
  nimbus:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nimbus:local
    container_name: nimbus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      WEB_DIR: /app/web
      DATABASE_URL: sqlite:///data/nimbus.db
      PORT: "8080"
      # Cobalt on the same Docker network (fallback for Instagram / TikTok WAF / galleries)
      NIMBUS_COBALT_API: http://cobalt:9000
    volumes:
      # Persistent application state: Telegram session, SQLite database, secrets,
      # thumbnails, caches, and temporary job data.
      - nimbus-data:/data
    depends_on:
      - cobalt
    networks:
      - caddy_proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted Cobalt API — used by Nimbus Fetch (not public; Docker network only)
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: cobalt
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      API_URL: "http://cobalt:9000/"
      API_NAME: "nimbus-home"
    networks:
      - caddy_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_proxy:
    external: true

volumes:
  nimbus-data:
    # Stable host-wide volume name so Compose project names cannot create a new volume.
    name: nimbus-data
