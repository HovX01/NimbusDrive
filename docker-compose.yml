services:
  nimbus:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    volumes:
      # Persistent application state: Telegram session, SQLite database, secrets,
      # thumbnails, caches, and temporary job data.
      - nimbus-data:/data
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:///data/nimbus.db
    restart: unless-stopped

volumes:
  nimbus-data:
    name: nimbus-data
